<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가상 회사</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>가상 회사</div>
      <button id="projectBtn" class="project-btn" type="button" title="작업할 프로젝트 폴더 열기">
        <span class="folder-ico" aria-hidden="true"></span><span id="projectName">프로젝트 열기</span>
      </button>
      <div class="spacer"></div>
      <button id="notifyBtn" class="notify-btn" type="button" aria-pressed="false" title="창을 보고 있지 않을 때 승인 요청·결재 대기·응답 완료를 알림으로 받습니다">알림 꺼짐</button>
      <div id="cliStatus" class="cli-status" data-state="checking">claude 확인 중</div>
      <div id="costMeter" class="cost" title="claude가 보고한 환산 비용. 구독 사용 시 실제 청구액이 아니라 사용량 참고치입니다.">사용량 $0.00</div>
    </header>

    <main class="floor">
      <section class="office-wrap" id="officeWrap">
        <canvas id="office" aria-label="가상 사무실. 직원을 누르면 작업 내용을 볼 수 있습니다." role="img"></canvas>
        <div id="officeEmpty" class="office-empty" hidden>
          <p>프로젝트 폴더를 열면 직원들이 출근합니다.</p>
          <button class="btn primary" type="button" data-action="open-folder">폴더 열기</button>
        </div>
      </section>
      <section class="stagebar">
        <ol id="stageSteps" class="stage-steps" aria-label="현재 업무 단계"></ol>
        <ul id="feed" class="feed" aria-live="polite"></ul>
      </section>
    </main>

    <aside class="side">
      <div id="permTray" class="perm-tray" aria-live="assertive"></div>
      <nav class="tabs" role="tablist">
        <button role="tab" class="tab" data-tab="chat" aria-selected="true">대화</button>
        <button role="tab" class="tab" data-tab="agent" aria-selected="false">직원</button>
        <button role="tab" class="tab" data-tab="files" aria-selected="false">산출물</button>
        <button role="tab" class="tab" data-tab="settings" aria-selected="false">설정</button>
      </nav>

      <section class="pane" id="pane-chat" role="tabpanel">
        <div class="conv-bar">
          <select id="convSelect" aria-label="대화 목록"></select>
          <button class="btn small" type="button" id="newConvBtn">새 대화</button>
        </div>
        <div id="messages" class="messages"></div>
        <div id="chatStatus" class="chat-status" role="status" aria-live="polite" hidden></div>
        <form id="composer" class="composer" autocomplete="off">
          <ul id="cmdPop" class="cmd-pop" role="listbox" aria-label="명령어" hidden></ul>
          <textarea id="input" rows="3" placeholder="무엇이든 적으세요. 대표가 대화·단독·팀 중 처리 방식을 정합니다. Enter로 보내고 Shift+Enter로 줄을 바꿉니다. /를 입력하면 Claude Code 명령어를 고를 수 있습니다." aria-autocomplete="list" aria-controls="cmdPop"></textarea>
          <div class="composer-foot">
            <select id="permMode" aria-label="대화로 처리할 때 도구 승인 방식" title="대화로 처리할 때 도구 승인 방식">
              <option value="manual">매번 묻기</option>
              <option value="acceptEdits">파일 수정 자동 허용</option>
              <option value="auto">자동 판단</option>
              <option value="plan">계획만 세우기</option>
              <option value="bypassPermissions">모두 허용(주의)</option>
            </select>
            <span id="composerHint" class="hint"></span>
            <button type="button" id="stopBtn" class="btn small danger" hidden>중지</button>
            <button type="submit" id="sendBtn" class="btn primary">보내기</button>
          </div>
        </form>
      </section>

      <section class="pane" id="pane-agent" role="tabpanel" hidden>
        <div id="agentChips" class="agent-chips"></div>
        <div id="agentHead" class="agent-head"></div>
        <div id="agentLog" class="messages"></div>
      </section>

      <section class="pane" id="pane-files" role="tabpanel" hidden>
        <div class="files-bar">
          <button class="btn small" type="button" id="refreshFiles">새로고침</button>
          <button class="btn small" type="button" id="showDiff">변경사항(git diff)</button>
        </div>
        <ul id="fileList" class="file-list"></ul>
        <div id="fileView" class="file-view"></div>
      </section>

      <section class="pane" id="pane-settings" role="tabpanel" hidden>
        <form id="settingsForm" class="settings"></form>
      </section>
    </aside>
  </div>

  <dialog id="folderDlg" class="dlg">
    <form method="dialog" class="dlg-body">
      <h2>프로젝트 폴더 열기</h2>
      <div class="path-row">
        <input id="folderPath" type="text" spellcheck="false" aria-label="폴더 경로" />
        <button class="btn small" type="button" id="folderGo">이동</button>
      </div>
      <div id="recentList" class="recent"></div>
      <ul id="folderList" class="folder-list"></ul>
      <p id="folderNote" class="hint"></p>
      <div class="dlg-actions">
        <button class="btn" value="cancel">취소</button>
        <button class="btn primary" type="button" id="folderOpen">이 폴더 열기</button>
      </div>
    </form>
  </dialog>

  <dialog id="rejectDlg" class="dlg">
    <form method="dialog" class="dlg-body">
      <h2>반려하고 다시 맡기기</h2>
      <p class="hint">무엇이 마음에 들지 않는지 적어주세요. 개발자에게 그대로 전달됩니다.</p>
      <textarea id="rejectText" rows="5"></textarea>
      <div class="dlg-actions">
        <button class="btn" value="cancel">취소</button>
        <button class="btn primary" type="button" id="rejectSend">반려하기</button>
      </div>
    </form>
  </dialog>

  <script src="/markdown.js"></script>
  <script src="/office.js"></script>
  <script src="/app.js"></script>
</body>
</html>
